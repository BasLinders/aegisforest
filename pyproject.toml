[project]
name = "aegisforest"
version = "0.1.0"
description = "Causal analysis of criminal-justice intervention effects, extended with contradiction detection across suspect statements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "econml>=0.15",
    "dowhy>=0.8",
    # dowhy 0.8 (its latest release) calls networkx.algorithms.d_separated,
    # which networkx removed in 3.3+ in favor of is_d_separator. Pin below
    # that until dowhy publishes a networkx-3.3+-compatible release.
    "networkx>=3.2,<3.3",
    "transformers>=4.40",
    "torch>=2.2",
    "spacy>=3.7",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
app = [
    "streamlit>=1.35",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: refits a real model (e.g. CausalForestDML) and can take ~1 minute; run explicitly with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py310"
