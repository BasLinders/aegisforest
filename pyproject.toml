[project]
name = "aegisforest"
version = "0.1.0"
description = "Causal analysis of criminal-justice intervention effects, extended with contradiction detection across suspect statements."
readme = "README.md"
requires-python = ">=3.10,<3.14"  # dowhy 0.14 caps at <3.14; see README for the venv setup
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "econml>=0.15",
    "dowhy>=0.11",
    "networkx>=3.2",
    "transformers>=4.40",
    "torch>=2.2",
    "spacy>=3.7",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
app = [
    "streamlit>=1.35",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*", "models*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: refits a real model (e.g. CausalForestDML) and can take ~1 minute; run explicitly with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py310"
