# aegisforest default configuration
# Module A: causal recidivism analysis
module_a:
  data:
    # Which ACEs (psychosocial confounder) source to load. Both sources conform
    # to the schema in data/schema.py, so nothing downstream branches on this.
    aces_source: aces_real  # one of: aces_real, aces_simulated
    # US strata by race x sex; NL strata by country of birth x sex (Dutch
    # registries generally don't record race — see data/loaders/aces_simulated.py).
    # Only affects the ACEs layer here; there's no NL recidivism loader yet
    # (nij_loader.py/compas_loader.py are both US-specific), so a full NL
    # pipeline run also needs that loader written first.
    jurisdiction: US  # one of: US, NL
    nij_path: data/raw/nij_recidivism.csv
    compas_path: data/raw/compas.csv
    aces_real_path: data/raw/aces_cdc_kaiser.csv

  classifier:
    model: xgboost  # one of: xgboost, logistic_regression
    # race_ethnicity is absent for some sources (e.g. Dutch registries don't
    # record it) — train_baseline/fairness_audit skip it when missing rather
    # than requiring it.
    protected_attributes: [race_ethnicity, sex]
    test_size: 0.2
    random_state: 42

  fairness_audit:
    metrics: [calibration, false_positive_rate_parity]
    subgroup_min_n: 30

  causal:
    treatment: supervision_intensity
    outcome: recidivated  # matches RECIDIVISM_SCHEMA's outcome column
    dag_path: models/causal/dag_spec.yaml
    n_estimators: 500
    refuters: [placebo_treatment_refuter, random_common_cause, data_subset_refuter]

# Module B: statement contradiction detection
module_b:
  nli:
    # English-only (trained on MultiNLI) — Dutch statements need a Dutch or
    # multilingual NLI checkpoint instead; not yet chosen/evaluated, see
    # BUILD_PLAN.md's open questions.
    checkpoint: roberta-large-mnli
    contradiction_threshold: 0.5
    device: auto  # one of: auto, cpu, cuda
  timeline_check:
    enabled: false
    ner_model: en_core_web_sm

reporting:
  output_dir: reports/output
  # Synthetic-data labeling is not a toggle: reports/templates/module_a_cate_report.md.j2
  # always shows the SYNTHETIC DATA banner when aces_source is aces_simulated.
  # A config flag to disable that would contradict the constraint it enforces
  # (BUILD_PLAN.md #5), so there's deliberately no label_synthetic_data setting here.
